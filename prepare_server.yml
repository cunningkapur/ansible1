---

- hosts: localhost
  gather_facts: no
# get IP of new server 
  vars_prompt:
  - name: new_host
    prompt: New host IP address
    private: no

  tasks:
  - name: Add provided host to temporary inventory
    add_host:
      name: "{{ new_host }}"
      groups: temporary_host_group 
      ansible_user: "{{ server_user }}"
#      ansible_password: testpassword
#      ansible_become_password: testpassword
  - name: Add provided host to known hosts
    shell: ssh-keyscan -H "{{ new_host }}" >> ~/.ssh/known_hosts

- hosts: temporary_host_group
  vars_files:
    - /home/ansible/vault/credentials01.yml
  become: true
  ansible_become_pass: "{{ server_password }}"
  tasks:
  - name: Create ansible user
    ansible.builtin.user:
      name: ansible
      home: /home/ansible
      shell: /bin/bash
      password_lock: true

  - name: create ssh directory for ansible user
    ansible.builtin.file:
      path: /home/ansible/.ssh
      state: directory
      mode: 0700
      owner: ansible
      group: ansible

  - name: create ssh directory for admin user
    ansible.builtin.file:
      path: "/home/{{ server_user}}/.ssh"
      state: directory
      mode: 0700
      owner: "{{ server_user }}"
      group: "{{ server_user }}"

  - name: copy ssh public key for ansible user
    template:
      src: /home/ansible/ansiblekey.j2
      dest: /home/ansible/.ssh/authorized_keys
      owner: ansible
      group: ansible
      mode: 0600

  - name: copy ssh public key for admin user
    template:
      src: /home/ansible/adminkey.j2
      dest: "/home/{{server_user}}/.ssh/authorized_keys"
      owner: "{{ server_user }}"
      group: "{{ server_user }}"
      mode: 0600

  - name: add config template to /etc/sshd/ssh_config.d/
    template:
      src: /home/ansible/ansible1/00_sshd_basic.j2
      dest: /etc/ssh/sshd_config.d/00_sshd_basic.conf
      owner: root
      group: root
      mode: 0600
    
  - name: install fail2ban
    dnf:
      name: fail2ban
      state: latest

  - name: remove cockpit
    dnf:
      name: cockpit
      state: absent
  
  - name: restart sshd service
    systemd_service:
      state: restarted
      name: sshd
